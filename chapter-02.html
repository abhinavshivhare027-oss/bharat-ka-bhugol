<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>भारत का भौतिक विभाजन | Chapter 02</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      background: #f4f8fc;
      color: #17324d;
    }

    .chapter02 {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .chapter-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .chapter-number {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      background: #e8f3ff;
      color: #1769aa;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .chapter-header h1 {
      margin: 14px 0 6px;
      font-size: 34px;
      color: #102a43;
    }

    .chapter-header p {
      margin: 0;
      color: #718096;
      letter-spacing: 2px;
      font-size: 14px;
    }

    .map-card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.12);
      border: 1px solid #e5edf5;
    }

    .map-title {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .map-number {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#1769aa,#42a5f5);
      color: white;
      border-radius: 15px;
      font-size: 21px;
      font-weight: bold;
    }

    .map-title h2 {
      margin: 0;
      font-size: 21px;
      color: #17324d;
    }

    .map-title p {
      margin: 4px 0 0;
      color: #718096;
      font-size: 13px;
    }

    .map-image-box {
      background: #f5f8fc;
      border-radius: 18px;
      padding: 10px;
      text-align: center;
      overflow: hidden;
    }

    .chapter-map {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
    }

    .map-note {
      margin-top: 12px;
      text-align: center;
      color: #718096;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      .chapter02 {
        padding: 25px 12px;
      }

      .chapter-header h1 {
        font-size: 26px;
      }

      .map-card {
        padding: 12px;
        border-radius: 18px;
      }

      .map-title h2 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="chapter02">

    <div class="chapter-header">

      <span class="chapter-number">
        CHAPTER 02
      </span>

      <h1>भारत का भौतिक विभाजन</h1>

      <p>
        PHYSICAL CLASSIFICATION OF INDIA
      </p>

    </div>


    <div class="map-card">

      <div class="map-title">

        <div class="map-number">
          02
        </div>

        <div>
          <h2>भारत का भौतिक विभाजन</h2>

          <p>
            भारत का भौतिक विभाजन मानचित्र
          </p>
        </div>

      </div>


      <div class="map-image-box">

        <img
          src="chapter02-map.jpg"
          alt="भारत का भौतिक विभाजन मानचित्र"
          class="chapter-map"
        >

      </div>

      <div class="map-note">
        भारत का भौतिक विभाजन — मानचित्र
      </div>

    </div>

  </main>

</body>
</html>
